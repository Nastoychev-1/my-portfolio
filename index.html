<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | High Fashion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --text: #2c2c2c;
            --text-secondary: #7a7a7a;
            --accent: #dca8b4;
            --accent-soft: #f2e5e9;
            --border: #e5e5e5;
            --radius: 2px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.4s, color 0.4s;
            letter-spacing: 0.02em;
        }

        /* Navigation – minimal, high fashion */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 2.5rem;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.4s;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }
        .nav-name {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 500;
            font-size: 1.5rem;
            letter-spacing: 0.04em;
            color: var(--text);
            cursor: pointer;
            transition: color var(--transition);
            white-space: nowrap;
        }
        .nav-name:hover {
            color: var(--accent);
        }
        .nav-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .nav-links button {
            background: transparent;
            border: none;
            padding: 0.5rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            font-family: var(--font-sans);
        }
        .nav-links button:hover {
            color: var(--text);
            border-bottom-color: var(--accent);
        }
        .nav-links button.active {
            color: var(--text);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }
        .settings-icon {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0.5rem;
            border-radius: 50%;
            transition: all var(--transition);
            display: flex;
            align-items: center;
        }
        .settings-icon:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }

        /* Main content */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 2.5rem 4rem;
            animation: fade 0.5s ease;
        }
        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* Home page – signature name + gallery */
        .home-signature {
            text-align: center;
            margin-bottom: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .home-signature h1 {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 400;
            font-size: clamp(3.5rem, 8vw, 6rem);
            letter-spacing: -0.02em;
            color: var(--text);
            line-height: 1.1;
            margin-bottom: 0.3rem;
            transition: color 0.4s;
        }
        .home-signature .sub {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            color: var(--text-secondary);
            font-weight: 400;
            border-top: 1px solid var(--border);
            padding-top: 0.8rem;
            margin-top: 0.8rem;
        }

        /* Gallery grid – minimalist masonry style */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .gallery-item {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 3/4;
            background: #f9f9f9;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.03);
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(44, 44, 44, 0.7);
            backdrop-filter: blur(6px);
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s, background 0.2s;
            z-index: 5;
            line-height: 1;
            font-weight: 300;
        }
        .gallery-item:hover .delete-btn {
            opacity: 1;
        }
        .delete-btn:hover {
            background: #b56576;
        }

        .add-card {
            aspect-ratio: 3/4;
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            background: transparent;
            color: var(--text-secondary);
            gap: 0.4rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
            min-height: 220px;
        }
        .add-card:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(220, 168, 180, 0.04);
        }
        .add-card .plus {
            font-size: 2.8rem;
            font-weight: 200;
            line-height: 1;
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeOverlay 0.2s ease;
        }
        @keyframes fadeOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--surface);
            border-radius: 8px;
            padding: 2.2rem;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            border: 1px solid var(--border);
            animation: modalSlide 0.3s ease;
        }
        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal h3 {
            font-family: var(--font-serif);
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: 0.02em;
            margin-bottom: -0.2rem;
        }
        .modal input[type="text"],
        .modal input[type="file"] {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95rem;
            background: #fdfdfd;
            color: var(--text);
            transition: border 0.2s;
            font-family: var(--font-sans);
        }
        .modal input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .modal .divider {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .modal .divider::before,
        .modal .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
            margin: 0 0.7rem;
        }
        .btn-row {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.7rem 1.6rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: all 0.25s;
            font-family: var(--font-sans);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: #c98b9b;
            box-shadow: 0 6px 16px rgba(220, 168, 180, 0.4);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background: #f5f5f5;
        }
        .btn-danger {
            background: transparent;
            border: 1px solid #c98b9b;
            color: #b56576;
        }
        .btn-danger:hover {
            background: #f9f0f2;
        }

        /* Settings specific */
        .color-options {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .color-swatch.selected {
            border-color: var(--text);
            transform: scale(1.1);
        }
        .bg-options {
            display: flex;
            gap: 0.8rem;
        }
        .bg-option {
            padding: 0.5rem 1.2rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: #fff;
        }
        .bg-option.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                padding: 0 1.2rem;
                height: auto;
                flex-wrap: wrap;
                gap: 0.5rem;
                padding-bottom: 0.8rem;
            }
            .nav-left {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
                width: 100%;
            }
            .nav-links {
                width: 100%;
                justify-content: flex-start;
            }
            main {
                padding: 1.5rem 1.2rem;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <div class="nav-name" id="navBrandName">YOUR NAME</div>
            <div class="nav-links">
                <button class="nav-tab active" data-page="home">Home</button>
                <button class="nav-tab" data-page="brands">Brands</button>
                <button class="nav-tab" data-page="shows">Shows</button>
                <button class="nav-tab" data-page="skincare">Skin Care</button>
            </div>
        </div>
        <button class="settings-icon" id="settingsBtn" title="Customize">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </nav>

    <main>
        <!-- Home Page -->
        <div id="page-home" class="page active">
            <div class="home-signature">
                <h1 id="displayName">YOUR NAME</h1>
                <div class="sub">PORTFOLIO · HIGH FASHION</div>
            </div>
            <div class="gallery" id="gallery-home"></div>
            <div class="add-card" id="addHomeImage">
                <span class="plus">+</span>
                <span>Add image</span>
            </div>
        </div>

        <!-- Brands Page -->
        <div id="page-brands" class="page">
            <div class="gallery" id="gallery-brands"></div>
            <div class="add-card" id="addBrandsImage">
                <span class="plus">+</span>
                <span>Add image</span>
            </div>
        </div>

        <!-- Shows Page -->
        <div id="page-shows" class="page">
            <div class="gallery" id="gallery-shows"></div>
            <div class="add-card" id="addShowsImage">
                <span class="plus">+</span>
                <span>Add image</span>
            </div>
        </div>

        <!-- Skin Care Page -->
        <div id="page-skincare" class="page">
            <div class="gallery" id="gallery-skincare"></div>
            <div class="add-card" id="addSkincareImage">
                <span class="plus">+</span>
                <span>Add image</span>
            </div>
        </div>
    </main>

    <!-- Add Image Modal -->
    <div class="modal-overlay" id="addImageModal" style="display: none;">
        <div class="modal">
            <h3>Add Image</h3>
            <input type="text" id="imageUrlInput" placeholder="Paste image URL (https://...)">
            <div class="divider">or</div>
            <input type="file" id="imageFileInput" accept="image/*">
            <div class="btn-row">
                <button class="btn btn-secondary" id="cancelAddImage">Cancel</button>
                <button class="btn btn-primary" id="confirmAddImage">Add</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal" style="display: none;">
        <div class="modal">
            <h3>Customize</h3>
            <label style="font-size:0.85rem; text-transform:uppercase; letter-spacing:0.08em;">Your Name</label>
            <input type="text" id="settingsName" placeholder="Your name">
            <label style="font-size:0.85rem; text-transform:uppercase; letter-spacing:0.08em;">Accent Color</label>
            <div class="color-options" id="accentColors">
                <div class="color-swatch" style="background:#dca8b4;" data-color="#dca8b4"></div>
                <div class="color-swatch" style="background:#c49b9b;" data-color="#c49b9b"></div>
                <div class="color-swatch" style="background:#d9c5b0;" data-color="#d9c5b0"></div>
                <div class="color-swatch" style="background:#b0afaf;" data-color="#b0afaf"></div>
                <div class="color-swatch" style="background:#e6b8c0;" data-color="#e6b8c0"></div>
            </div>
            <label style="font-size:0.85rem; text-transform:uppercase; letter-spacing:0.08em;">Background</label>
            <div class="bg-options" id="bgOptions">
                <span class="bg-option selected" data-bg="#ffffff">White</span>
                <span class="bg-option" data-bg="#f9f6f2">Beige</span>
            </div>
            <div class="btn-row" style="justify-content: space-between;">
                <button class="btn btn-danger" id="resetAllData">Reset All</button>
                <div>
                    <button class="btn btn-secondary" id="cancelSettings">Cancel</button>
                    <button class="btn btn-primary" id="saveSettings">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ----- STATE -----
            const STORAGE_KEY = 'fashionPortfolio';
            let state = {
                name: 'YOUR NAME',
                accent: '#dca8b4',
                bg: '#ffffff',
                images: {
                    home: [],
                    brands: [],
                    shows: [],
                    skincare: []
                }
            };

            // ----- DOM ELEMENTS -----
            const navBrand = document.getElementById('navBrandName');
            const displayNameEl = document.getElementById('displayName');
            const navTabs = document.querySelectorAll('.nav-tab');
            const pages = {
                home: document.getElementById('page-home'),
                brands: document.getElementById('page-brands'),
                shows: document.getElementById('page-shows'),
                skincare: document.getElementById('page-skincare')
            };
            const galleries = {
                home: document.getElementById('gallery-home'),
                brands: document.getElementById('gallery-brands'),
                shows: document.getElementById('gallery-shows'),
                skincare: document.getElementById('gallery-skincare')
            };

            // Modals
            const addImageModal = document.getElementById('addImageModal');
            const settingsModal = document.getElementById('settingsModal');
            const imageUrlInput = document.getElementById('imageUrlInput');
            const imageFileInput = document.getElementById('imageFileInput');
            let currentAddCategory = 'home';

            // ----- INITIALIZE -----
            function loadState() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        state.name = parsed.name || 'YOUR NAME';
                        state.accent = parsed.accent || '#dca8b4';
                        state.bg = parsed.bg || '#ffffff';
                        state.images = parsed.images || { home: [], brands: [], shows: [], skincare: [] };
                    } catch (e) {
                        console.warn('Could not parse stored data');
                    }
                }
                applySettings();
                renderAllGalleries();
                updateNameDisplay();
            }

            function saveState() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            }

            function applySettings() {
                document.documentElement.style.setProperty('--accent', state.accent);
                document.documentElement.style.setProperty('--bg', state.bg);
                document.documentElement.style.setProperty('--surface', state.bg);
                // update accent soft (lighter version) – simple opacity approach
                const softColor = state.accent + '1a'; // 10% opacity
                document.documentElement.style.setProperty('--accent-soft', softColor);
                document.body.style.backgroundColor = state.bg;
            }

            function updateNameDisplay() {
                navBrand.textContent = state.name;
                if (displayNameEl) displayNameEl.textContent = state.name;
            }

            // ----- RENDER GALLERIES -----
            function renderGallery(category) {
                const container = galleries[category];
                if (!container) return;
                container.innerHTML = '';
                const images = state.images[category] || [];
                images.forEach((img, index) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.innerHTML = `
                        <img src="${img.url}" alt="portfolio image" loading="lazy">
                        <button class="delete-btn" data-category="${category}" data-index="${index}">✕</button>
                    `;
                    container.appendChild(item);
                });

                // attach delete events
                container.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const cat = btn.dataset.category;
                        const idx = parseInt(btn.dataset.index, 10);
                        deleteImage(cat, idx);
                    });
                });
            }

            function renderAllGalleries() {
                Object.keys(galleries).forEach(cat => renderGallery(cat));
            }

            function deleteImage(category, index) {
                state.images[category].splice(index, 1);
                saveState();
                renderGallery(category);
            }

            function addImageToCategory(category, url) {
                if (!url || url.trim() === '') return;
                state.images[category].push({ url: url.trim() });
                saveState();
                renderGallery(category);
            }

            // ----- PAGE NAVIGATION -----
            function switchPage(pageId) {
                Object.values(pages).forEach(p => p.classList.remove('active'));
                if (pages[pageId]) pages[pageId].classList.add('active');
                navTabs.forEach(tab => {
                    const tabPage = tab.dataset.page;
                    if (tabPage === pageId) tab.classList.add('active');
                    else tab.classList.remove('active');
                });
            }

            navTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    switchPage(tab.dataset.page);
                });
            });
            navBrand.addEventListener('click', () => switchPage('home'));

            // ----- ADD IMAGE MODAL -----
            function openAddModal(category) {
                currentAddCategory = category;
                imageUrlInput.value = '';
                imageFileInput.value = '';
                addImageModal.style.display = 'flex';
            }
            function closeAddModal() {
                addImageModal.style.display = 'none';
            }

            document.getElementById('addHomeImage').addEventListener('click', () => openAddModal('home'));
            document.getElementById('addBrandsImage').addEventListener('click', () => openAddModal('brands'));
            document.getElementById('addShowsImage').addEventListener('click', () => openAddModal('shows'));
            document.getElementById('addSkincareImage').addEventListener('click', () => openAddModal('skincare'));

            document.getElementById('cancelAddImage').addEventListener('click', closeAddModal);
            document.getElementById('confirmAddImage').addEventListener('click', () => {
                const url = imageUrlInput.value.trim();
                const file = imageFileInput.files[0];
                if (url) {
                    addImageToCategory(currentAddCategory, url);
                    closeAddModal();
                } else if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        addImageToCategory(currentAddCategory, e.target.result);
                        closeAddModal();
                    };
                    reader.readAsDataURL(file);
                } else {
                    alert('Please provide an image URL or select a file.');
                }
            });

            // Close modals on overlay click
            window.addEventListener('click', (e) => {
                if (e.target === addImageModal) closeAddModal();
                if (e.target === settingsModal) closeSettingsModal();
            });

            // ----- SETTINGS MODAL -----
            const settingsNameInput = document.getElementById('settingsName');
            const accentColorContainer = document.getElementById('accentColors');
            const bgOptionsContainer = document.getElementById('bgOptions');

            function openSettingsModal() {
                settingsNameInput.value = state.name;
                // Highlight current accent
                document.querySelectorAll('#accentColors .color-swatch').forEach(swatch => {
                    if (swatch.dataset.color === state.accent) swatch.classList.add('selected');
                    else swatch.classList.remove('selected');
                });
                // Highlight current bg
                document.querySelectorAll('#bgOptions .bg-option').forEach(opt => {
                    if (opt.dataset.bg === state.bg) opt.classList.add('selected');
                    else opt.classList.remove('selected');
                });
                settingsModal.style.display = 'flex';
            }
            function closeSettingsModal() {
                settingsModal.style.display = 'none';
            }

            document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
            document.getElementById('cancelSettings').addEventListener('click', closeSettingsModal);
            document.getElementById('saveSettings').addEventListener('click', () => {
                state.name = settingsNameInput.value.trim() || 'YOUR NAME';
                const selectedAccent = document.querySelector('#accentColors .color-swatch.selected');
                if (selectedAccent) state.accent = selectedAccent.dataset.color;
                const selectedBg = document.querySelector('#bgOptions .bg-option.selected');
                if (selectedBg) state.bg = selectedBg.dataset.bg;
                applySettings();
                updateNameDisplay();
                saveState();
                closeSettingsModal();
            });

            // Accent color picker
            accentColorContainer.addEventListener('click', (e) => {
                const swatch = e.target.closest('.color-swatch');
                if (!swatch) return;
                document.querySelectorAll('#accentColors .color-swatch').forEach(s => s.classList.remove('selected'));
                swatch.classList.add('selected');
            });

            // Background picker
            bgOptionsContainer.addEventListener('click', (e) => {
                const opt = e.target.closest('.bg-option');
                if (!opt) return;
                document.querySelectorAll('#bgOptions .bg-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
            });

            // Reset all data
            document.getElementById('resetAllData').addEventListener('click', () => {
                if (confirm('Delete all images and reset name to default? This cannot be undone.')) {
                    state = {
                        name: 'YOUR NAME',
                        accent: '#dca8b4',
                        bg: '#ffffff',
                        images: { home: [], brands: [], shows: [], skincare: [] }
                    };
                    applySettings();
                    updateNameDisplay();
                    renderAllGalleries();
                    saveState();
                    closeSettingsModal();
                }
            });

            // Start
            loadState();
        })();
    </script>
</body>
</html>
